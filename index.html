<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff3e88" />
  <title>Sweet Saga: Match 3 Puzzle</title>
  <link rel="manifest" href="./manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #ff7eb3 0%, #7a28cb 55%, #2b0947 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* SAGA MAP SCREEN */
    #map-screen {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      background: linear-gradient(180deg, #ff5f9e 0%, #8e2de2 50%, #4a00e0 100%);
      position: relative;
      overflow-y: auto;
    }
    .logo-title {
      font-size: 36px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 4px 0 #b8005c, 0 8px 20px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .subtitle {
      font-size: 13px;
      background: rgba(255,255,255,0.2);
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 6px;
      backdrop-filter: blur(6px);
    }
    .map-path {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 22px;
      margin: 28px 0 90px;
      width: 100%;
    }
    .level-node {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.35);
      transition: transform 0.15s;
    }
    .level-node:active { transform: scale(0.92); }
    .level-node.unlocked {
      background: radial-gradient(circle at 30% 30%, #ffe259, #ffa751);
      color: #5c1900;
      border: 4px solid #fff;
    }
    .level-node.current {
      background: radial-gradient(circle at 30% 30%, #ff4b8b, #d50055);
      color: #fff;
      border: 4px solid #ffe600;
      animation: pulseNode 1.4s infinite;
    }
    .level-node.locked {
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.5);
      border: 3px solid rgba(255,255,255,0.25);
      cursor: not-allowed;
    }
    .stars-mini { font-size: 10px; margin-top: 2px; letter-spacing: 1px; }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* GAME SCREEN */
    #game-screen {
      display: none;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px 18px;
    }
    .top-hud {
      width: 100%;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .hud-box { text-align: center; }
    .hud-label { font-size: 11px; text-transform: uppercase; opacity: 0.85; font-weight: 700; }
    .hud-val { font-size: 20px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .progress-wrap {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.35);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
      border: 1px solid rgba(255,255,255,0.25);
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffe600, #ff4b8b);
      transition: width 0.3s ease;
    }

    /* BOARD */
    #board-wrap {
      position: relative;
      padding: 8px;
      background: rgba(25, 8, 48, 0.65);
      border-radius: 20px;
      border: 3px solid rgba(255,255,255,0.35);
      box-shadow: 0 14px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1);
    }
    #board-wrap.shake { animation: shakeAnim 0.35s ease; }
    @keyframes shakeAnim {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, -3px); }
      80% { transform: translate(4px, 3px); }
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      width: min(88vw, 376px);
      height: min(88vw, 376px);
      touch-action: none;
    }
    .cell {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
      cursor: pointer;
    }
    .cell.jelly {
      background: rgba(120, 235, 255, 0.38);
      box-shadow: inset 0 0 8px #ffffff, 0 0 6px rgba(120, 235, 255, 0.6);
      border: 1.5px solid rgba(255,255,255,0.7);
    }
    .cell.selected {
      transform: scale(1.16);
      background: rgba(255, 230, 0, 0.45);
      box-shadow: 0 0 14px #ffe600;
      z-index: 5;
    }
    .cell.hint {
      animation: hintBounce 0.8s infinite;
    }
    @keyframes hintBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); filter: brightness(1.3); }
    }

    /* CANDY STYLES */
    .candy {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      position: relative;
      box-shadow: inset -3px -4px 7px rgba(0,0,0,0.35), inset 3px 3px 6px rgba(255,255,255,0.75), 0 3px 6px rgba(0,0,0,0.35);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .candy::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 18%;
      width: 32%;
      height: 20%;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      transform: rotate(-25deg);
    }
    .c-0 { background: radial-gradient(circle at 30% 30%, #ff6b6b, #c9184a); border-radius: 45%; } /* Red Jelly Bean */
    .c-1 { background: radial-gradient(circle at 30% 30%, #ffd166, #f77f00); border-radius: 30%; transform: rotate(45deg) scale(0.85); } /* Orange Lozenge */
    .c-2 { background: radial-gradient(circle at 30% 30%, #fff066, #eab308); border-radius: 50% 50% 45% 45%; } /* Yellow Drop */
    .c-3 { background: radial-gradient(circle at 30% 30%, #4ade80, #15803d); border-radius: 26%; } /* Green Square */
    .c-4 { background: radial-gradient(circle at 30% 30%, #38bdf8, #1d4ed8); } /* Blue Sphere */
    .c-5 { background: radial-gradient(circle at 30% 30%, #d8b4fe, #7e22ce); border-radius: 50% 20% 50% 20%; } /* Purple Cluster */

    /* SPECIAL CANDIES */
    .special-striped-h::before, .special-striped-v::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(255,255,255,0.85) 4px, rgba(255,255,255,0.85) 7px);
    }
    .special-striped-v::before {
      background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(255,255,255,0.85) 4px, rgba(255,255,255,0.85) 7px);
    }
    .special-wrapped {
      box-shadow: 0 0 0 4px rgba(255,255,255,0.85), 0 0 14px #fff;
      animation: wrappedGlow 1s infinite alternate;
    }
    @keyframes wrappedGlow { from { transform: scale(0.95); } to { transform: scale(1.06); } }
    .special-bomb {
      background: radial-gradient(circle at 35% 35%, #5c3a21, #1e0f05) !important;
      border-radius: 50% !important;
      transform: none !important;
      box-shadow: 0 0 14px #ffe600, inset 0 0 8px #ff4b8b !important;
      background-image: radial-gradient(#ff4b8b 15%, transparent 16%), radial-gradient(#38bdf8 15%, transparent 16%), radial-gradient(#ffe600 15%, transparent 16%) !important;
      background-size: 14px 14px !important;
      background-position: 2px 2px, 8px 8px, 4px 10px !important;
    }

    /* BOOSTERS BAR */
    .boosters-bar {
      width: 100%;
      display: flex;
      justify-content: space-around;
      gap: 8px;
    }
    .booster-btn {
      flex: 1;
      background: linear-gradient(180deg, #ff7eb3, #d50055);
      border: 2px solid #fff;
      border-radius: 16px;
      padding: 8px 6px;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #8a0037;
    }
    .booster-btn.active {
      background: linear-gradient(180deg, #ffe600, #f59e0b);
      color: #421800;
      transform: translateY(2px);
    }

    /* FLOATING TEXT & CALLOUTS */
    .float-score {
      position: absolute;
      font-weight: 900;
      font-size: 18px;
      color: #fff;
      text-shadow: 0 2px 6px #000, 0 0 10px #ff3e88;
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.25); }
    }
    #callout {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 40px;
      font-weight: 900;
      color: #ffe600;
      text-shadow: 0 4px 0 #b8005c, 0 8px 25px rgba(0,0,0,0.7);
      pointer-events: none;
      z-index: 50;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #callout.show { transform: translate(-50%, -50%) scale(1.1); }

    /* MODAL */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 4, 30, 0.82);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: linear-gradient(180deg, #ffffff, #ffe4f0);
      color: #3b0764;
      width: 100%;
      max-width: 340px;
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      border: 4px solid #ff4b8b;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-btn {
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #ff3e88, #ff8c00);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #b8005c;
    }
  </style>
</head>
<body>

  <!-- SAGA MAP SCREEN -->
  <div id="map-screen">
    <div class="logo-title">🍬 SWEET SAGA</div>
    <div class="subtitle" id="total-stars-label">⭐ 0 Stars Collected</div>
    <div class="map-path" id="map-path"></div>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div id="game-screen">
    <div style="width:100%">
      <div class="top-hud">
        <div class="hud-box">
          <div class="hud-label">Level</div>
          <div class="hud-val" id="hud-level">1</div>
        </div>
        <div class="hud-box">
          <div class="hud-label" id="goal-label">Jelly Left</div>
          <div class="hud-val" id="hud-goal">12</div>
        </div>
        <div class="hud-box">
          <div class="hud-label">Moves</div>
          <div class="hud-val" id="hud-moves">20</div>
        </div>
        <div class="hud-box">
          <div class="hud-label">Score</div>
          <div class="hud-val" id="hud-score">0</div>
        </div>
      </div>
      <div class="progress-wrap"><div id="progress-bar"></div></div>
    </div>

    <div id="board-wrap">
      <div id="grid"></div>
    </div>

    <div class="boosters-bar">
      <div class="booster-btn" id="btn-hammer" onclick="toggleBooster('hammer')">🍭 Hammer (<span id="cnt-hammer">2</span>)</div>
      <div class="booster-btn" id="btn-bomb" onclick="useColorBombBooster()">💣 Color Bomb (<span id="cnt-bomb">1</span>)</div>
      <div class="booster-btn" onclick="returnToMap()">🗺️ Map</div>
    </div>
  </div>

  <div id="callout">SWEET!</div>

  <div id="modal">
    <div class="modal-card">
      <h2 id="modal-title" style="font-size:28px;font-weight:900;">LEVEL CLEARED!</h2>
      <p id="modal-stars" style="font-size:32px;margin:10px 0;">⭐⭐⭐</p>
      <p id="modal-msg" style="font-size:15px;font-weight:600;opacity:0.85;"></p>
      <button class="modal-btn" id="modal-btn" onclick="nextAfterModal()">CONTINUE</button>
    </div>
  </div>

<script>
  /* WEB AUDIO API - CRUNCHY CANDY SOUND ENGINE */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

  function playTone(freq, type = 'sine', duration = 0.14, gainVal = 0.18, slideTo = null) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function soundSwap() { playTone(320, 'triangle', 0.12, 0.15, 520); }
  function soundPop(combo = 1) {
    const base = 420 + Math.min(combo, 8) * 75;
    playTone(base, 'sine', 0.15, 0.22, base * 1.45);
  }
  function soundBlast() {
    playTone(160, 'sawtooth', 0.32, 0.26, 45);
    setTimeout(() => playTone(680, 'triangle', 0.25, 0.2, 980), 80);
  }
  function soundWin() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.24, 0.22), i * 110));
  }

  /* GAME STATE */
  const SIZE = 8;
  const COLORS = 6;
  let board = [];
  let jelly = [];
  let selected = null;
  let busy = false;
  let score = 0;
  let moves = 20;
  let targetScore = 1500;
  let currentLevel = 1;
  let maxUnlocked = parseInt(localStorage.getItem('ss_unlocked') || '1');
  let starMap = JSON.parse(localStorage.getItem('ss_stars') || '{}');
  let boosters = { hammer: 2, bomb: 1 };
  let activeBooster = null;
  let hintTimer = null;

  function renderMap() {
    document.getElementById('map-screen').style.display = 'flex';
    document.getElementById('game-screen').style.display = 'none';
    const path = document.getElementById('map-path');
    path.innerHTML = '';
    let totalStars = Object.values(starMap).reduce((a, b) => a + b, 0);
    document.getElementById('total-stars-label').textContent = `⭐ ${totalStars} Stars Collected`;

    const totalNodes = Math.max(15, maxUnlocked + 4);
    for (let lvl = 1; lvl <= totalNodes; lvl++) {
      const node = document.createElement('div');
      const offset = Math.sin(lvl * 0.95) * 75;
      node.style.transform = `translateX(${offset}px)`;
      const unlocked = lvl <= maxUnlocked;
      node.className = 'level-node ' + (lvl === maxUnlocked ? 'current' : unlocked ? 'unlocked' : 'locked');
      const st = starMap[lvl] || 0;
      node.innerHTML = `<div>${lvl}</div><div class="stars-mini">${unlocked ? '⭐'.repeat(st) + '☆'.repeat(3 - st) : '🔒'}</div>`;
      if (unlocked) node.onclick = () => startLevel(lvl);
      path.appendChild(node);
    }
  }

  function startLevel(lvl) {
    initAudio();
    currentLevel = lvl;
    score = 0;
    moves = Math.max(15, 24 - Math.floor(lvl / 4));
    targetScore = 1200 + lvl * 450;
    activeBooster = null;
    selected = null;
    document.getElementById('map-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('hud-level').textContent = lvl;
    initBoard(lvl);
    updateHUD();
    resetHintTimer();
  }

  function initBoard(lvl) {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    jelly = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));

    // Add frosted jelly pattern based on level
    const jellyCount = Math.min(28, 6 + lvl * 2);
    let placed = 0;
    while (placed < jellyCount) {
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      if (!jelly[r][c]) { jelly[r][c] = true; placed++; }
    }

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        let color;
        do {
          color = Math.floor(Math.random() * COLORS);
        } while (
          (c >= 2 && board[r][c - 1]?.color === color && board[r][c - 2]?.color === color) ||
          (r >= 2 && board[r - 1][c]?.color === color && board[r - 2][c]?.color === color)
        );
        board[r][c] = { color, special: null };
      }
    }
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (jelly[r][c] ? ' jelly' : '');
        if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
        cell.dataset.r = r;
        cell.dataset.c = c;

        const item = board[r][c];
        if (item) {
          const candy = document.createElement('div');
          candy.className = `candy c-${item.color}`;
          if (item.special === 'striped-h') candy.classList.add('special-striped-h');
          if (item.special === 'striped-v') candy.classList.add('special-striped-v');
          if (item.special === 'wrapped') candy.classList.add('special-wrapped');
          if (item.special === 'bomb') candy.classList.add('special-bomb');
          cell.appendChild(candy);
        }
        cell.onclick = () => handleCellTap(r, c);
        setupSwipe(cell, r, c);
        grid.appendChild(cell);
      }
    }
  }

  function setupSwipe(el, r, c) {
    let sx = 0, sy = 0;
    el.ontouchstart = (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
    el.ontouchend = (e) => {
      if (busy) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
      let tr = r, tc = c;
      if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
      else tr += dy > 0 ? 1 : -1;
      if (tr >= 0 && tr < SIZE && tc >= 0 && tc < SIZE) {
        selected = null;
        trySwap(r, c, tr, tc);
      }
    };
  }

  function handleCellTap(r, c) {
    if (busy) return;
    resetHintTimer();

    if (activeBooster === 'hammer') {
      boosters.hammer--;
      activeBooster = null;
      document.getElementById('btn-hammer').classList.remove('active');
      soundBlast();
      triggerShake();
      clearCell(r, c, 1);
      busy = true;
      setTimeout(() => resolveBoard(1), 240);
      return;
    }

    if (!selected) {
      selected = { r, c };
      renderGrid();
      return;
    }
    if (selected.r === r && selected.c === c) {
      selected = null;
      renderGrid();
      return;
    }
    const dist = Math.abs(selected.r - r) + Math.abs(selected.c - c);
    if (dist === 1) {
      const prev = selected;
      selected = null;
      trySwap(prev.r, prev.c, r, c);
    } else {
      selected = { r, c };
      renderGrid();
    }
  }

  async function trySwap(r1, c1, r2, c2) {
    busy = true;
    soundSwap();
    const a = board[r1][c1], b = board[r2][c2];
    board[r1][c1] = b;
    board[r2][c2] = a;
    renderGrid();
    await sleep(170);

    // Special Fusion Combos (Color Bomb or Special + Special)
    if (a?.special === 'bomb' || b?.special === 'bomb') {
      moves--;
      const targetColor = a?.special === 'bomb' ? b.color : a.color;
      board[r1][c1] = null;
      board[r2][c2] = null;
      soundBlast();
      triggerShake();
      showCallout('SUGAR CRUSH!');
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c]?.color === targetColor) clearCell(r, c, 2);
        }
      }
      await resolveBoard(2);
      return;
    }

    if (a?.special && b?.special) {
      moves--;
      soundBlast();
      triggerShake();
      showCallout('MEGA COMBO!');
      for (let r = Math.max(0, r2 - 1); r <= Math.min(SIZE - 1, r2 + 1); r++) {
        for (let c = 0; c < SIZE; c++) clearCell(r, c, 2);
      }
      for (let c = Math.max(0, c2 - 1); c <= Math.min(SIZE - 1, c2 + 1); c++) {
        for (let r = 0; r < SIZE; r++) clearCell(r, c, 2);
      }
      await resolveBoard(2);
      return;
    }

    const matches = findMatches();
    if (matches.length === 0) {
      board[r1][c1] = a;
      board[r2][c2] = b;
      renderGrid();
      busy = false;
      return;
    }

    moves--;
    await resolveBoard(1, { r: r2, c: c2 });
  }

  function findMatches() {
    const matched = new Set();
    const groups = [];

    // Horizontal
    for (let r = 0; r < SIZE; r++) {
      let c = 0;
      while (c < SIZE) {
        const col = board[r][c]?.color;
        if (col === undefined) { c++; continue; }
        let end = c + 1;
        while (end < SIZE && board[r][end]?.color === col) end++;
        if (end - c >= 3) {
          const g = [];
          for (let k = c; k < end; k++) { matched.add(`${r},${k}`); g.push({ r, c: k }); }
          groups.push({ cells: g, dir: 'h' });
        }
        c = end;
      }
    }

    // Vertical
    for (let c = 0; c < SIZE; c++) {
      let r = 0;
      while (r < SIZE) {
        const col = board[r][c]?.color;
        if (col === undefined) { r++; continue; }
        let end = r + 1;
        while (end < SIZE && board[end][c]?.color === col) end++;
        if (end - r >= 3) {
          const g = [];
          for (let k = r; k < end; k++) { matched.add(`${k},${c}`); g.push({ r: k, c }); }
          groups.push({ cells: g, dir: 'v' });
        }
        r = end;
      }
    }
    return groups;
  }

  async function resolveBoard(combo, pivot = null) {
    const groups = findMatches();
    if (groups.length === 0) {
      applyGravity();
      renderGrid();
      updateHUD();
      checkEndState();
      busy = false;
      resetHintTimer();
      return;
    }

    soundPop(combo);
    if (combo === 2) showCallout('SWEET!');
    if (combo === 3) showCallout('DELICIOUS!');
    if (combo >= 4) { showCallout('DIVINE!'); triggerShake(); }

    const toSpawn = [];
    groups.forEach(g => {
      const first = pivot && g.cells.some(x => x.r === pivot.r && x.c === pivot.c) ? pivot : g.cells[0];
      const baseColor = board[first.r][first.c]?.color ?? 0;
      if (g.cells.length >= 5) {
        toSpawn.push({ r: first.r, c: first.c, color: baseColor, special: 'bomb' });
      } else if (g.cells.length === 4) {
        toSpawn.push({ r: first.r, c: first.c, color: baseColor, special: g.dir === 'h' ? 'striped-v' : 'striped-h' });
      }
      g.cells.forEach(({ r, c }) => clearCell(r, c, combo));
    });

    toSpawn.forEach(s => { board[s.r][s.c] = { color: s.color, special: s.special }; });
    renderGrid();
    updateHUD();
    await sleep(210);

    applyGravity();
    renderGrid();
    await sleep(210);
    await resolveBoard(combo + 1);
  }

  function clearCell(r, c, combo) {
    const item = board[r][c];
    if (!item) return;
    board[r][c] = null;
    if (jelly[r][c]) { jelly[r][c] = false; score += 80; }
    const pts = 30 * combo;
    score += pts;
    spawnFloatText(r, c, `+${pts}`);

    if (item.special === 'striped-h') {
      soundBlast();
      for (let k = 0; k < SIZE; k++) clearCell(r, k, combo);
    } else if (item.special === 'striped-v') {
      soundBlast();
      for (let k = 0; k < SIZE; k++) clearCell(k, c, combo);
    } else if (item.special === 'wrapped') {
      soundBlast();
      triggerShake();
      for (let rr = Math.max(0, r - 1); rr <= Math.min(SIZE - 1, r + 1); rr++) {
        for (let cc = Math.max(0, c - 1); cc <= Math.min(SIZE - 1, c + 1); cc++) clearCell(rr, cc, combo);
      }
    }
  }

  function applyGravity() {
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (board[r][c]) {
          board[write][c] = board[r][c];
          if (write !== r) board[r][c] = null;
          write--;
        }
      }
      while (write >= 0) {
        board[write][c] = { color: Math.floor(Math.random() * COLORS), special: null };
        write--;
      }
    }
  }

  function toggleBooster(type) {
    if (busy || boosters[type] <= 0) return;
    activeBooster = activeBooster === type ? null : type;
    document.getElementById('btn-hammer').classList.toggle('active', activeBooster === 'hammer');
  }

  function useColorBombBooster() {
    if (busy || boosters.bomb <= 0) return;
    boosters.bomb--;
    const r = Math.floor(Math.random() * SIZE);
    const c = Math.floor(Math.random() * SIZE);
    board[r][c] = { color: 0, special: 'bomb' };
    soundPop(4);
    renderGrid();
    updateHUD();
  }

  function updateHUD() {
    const jellyLeft = jelly.flat().filter(Boolean).length;
    document.getElementById('hud-goal').textContent = jellyLeft;
    document.getElementById('hud-moves').textContent = moves;
    document.getElementById('hud-score').textContent = score;
    document.getElementById('cnt-hammer').textContent = boosters.hammer;
    document.getElementById('cnt-bomb').textContent = boosters.bomb;
    const pct = Math.min(100, Math.round((score / targetScore) * 100));
    document.getElementById('progress-bar').style.width = pct + '%';
  }

  function checkEndState() {
    const jellyLeft = jelly.flat().filter(Boolean).length;
    if (jellyLeft === 0 && score >= targetScore) {
      soundWin();
      const stars = score >= targetScore * 1.5 ? 3 : score >= targetScore * 1.2 ? 2 : 1;
      starMap[currentLevel] = Math.max(starMap[currentLevel] || 0, stars);
      if (currentLevel >= maxUnlocked) maxUnlocked = currentLevel + 1;
      localStorage.setItem('ss_stars', JSON.stringify(starMap));
      localStorage.setItem('ss_unlocked', maxUnlocked);
      boosters.hammer++;
      showModal('LEVEL CLEARED!', '⭐'.repeat(stars), `Score: ${score} | Bonus +1 Hammer!`);
    } else if (moves <= 0) {
      showModal('OUT OF MOVES', '💔', `Jelly Left: ${jellyLeft} | Score: ${score} / ${targetScore}`);
    }
  }

  function showModal(title, stars, msg) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-stars').textContent = stars;
    document.getElementById('modal-msg').textContent = msg;
    document.getElementById('modal').style.display = 'flex';
  }

  function nextAfterModal() {
    document.getElementById('modal').style.display = 'none';
    renderMap();
  }

  function returnToMap() { renderMap(); }

  function spawnFloatText(r, c, text) {
    const wrap = document.getElementById('board-wrap');
    const el = document.createElement('div');
    el.className = 'float-score';
    el.textContent = text;
    el.style.left = `${(c + 0.3) * 12.2}%`;
    el.style.top = `${(r + 0.3) * 12.2}%`;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function showCallout(text) {
    const el = document.getElementById('callout');
    el.textContent = text;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 750);
  }

  function triggerShake() {
    const wrap = document.getElementById('board-wrap');
    wrap.classList.remove('shake');
    void wrap.offsetWidth;
    wrap.classList.add('shake');
  }

  function resetHintTimer() {
    clearTimeout(hintTimer);
    document.querySelectorAll('.cell.hint').forEach(el => el.classList.remove('hint'));
    hintTimer = setTimeout(() => {
      const cells = document.querySelectorAll('.cell');
      if (cells.length) cells[Math.floor(Math.random() * cells.length)].classList.add('hint');
    }, 3500);
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

  renderMap();
</script>
</body>
</html>
